server:
  port: 0  # Random available port for testing

spring:
  application:
    name: spring-boot-microservice-test
  thymeleaf:
    cache: false

# Actuator configuration for tests
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging configuration for tests
logging:
  level:
    com.example.microservice: DEBUG
    org.springframework.web: INFO
