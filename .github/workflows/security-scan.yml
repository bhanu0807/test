name: Security Scan

# Run security scans daily
on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  security-scan:
    name: Daily Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # OWASP Dependency Check
      - name: Run OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:check

      # Upload OWASP report
      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: target/dependency-check-report.html

      # Check for dependency updates
      - name: Check for Updates
        run: |
          mvn versions:display-dependency-updates > dependency-updates.txt
          cat dependency-updates.txt

      # Create issue if vulnerabilities found
      - name: Create Issue on Vulnerabilities
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security Vulnerabilities Detected',
              body: 'Daily security scan found vulnerabilities. Please review the OWASP report.',
              labels: ['security', 'high-priority']
            })
